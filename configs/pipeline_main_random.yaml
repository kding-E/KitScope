dataset_url: https://t3.znas.cn/rxHtGmUHCgg
manifest: manifest.jsonl
url_weights: splits/url_group_weights.csv
url_weight_stage: evaluation
split: random_zip_legacy_compatible

# These files are copied from the original KitScope experiment workspace.
# Paths are repository-relative so the same route can run from an extracted
# release bundle.
route_config: configs/layer1_default_causal_online_20260808.yaml
extraction_config: configs/universal_interactive_phishing_gateway_oracle_plus_noguard.yaml
runner_model_config: configs/default.yaml
fair_comparison_runner: scripts/run_fair_multiscale_window_comparison.py
column_spec: configs/comparison_column_spec.json
condition: five_windows
variant: dynamic_rank8
scan_step_s: 0.5
candidate_extraction_contract: causal_all_onsets
candidate_decision_delays_s: [0.75, 1.5, 2.5, 3.5]
causal_all_local_maxima: true
fallback_if_empty: false
min_after_capture_start_s: 0.0
min_after_first_party_s: 0.0
min_after_post_load_s: 0.0
max_scan_s:
post_load_guard_mode: none
skip_first_party_scan_guard: false
require_har: true

profiles:
  - name: KitScope-CR
    id: main_425
    representation: "425"
  - name: KitScope-EV
    id: main_228
    representation: "228"
